name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui && npm run build --prefix ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  build:
    name: Build ${{ matrix.target }}
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: auris-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: auris-aarch64-unknown-linux-gnu.tar.gz
            cross: true
          # macos-14/macos-15-intel retirés des runners GitHub en 2026 :
          # seul le build arm64 (macos-latest) est produit pour macOS.
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: auris-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: auris-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: dépendances système (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross }}" = "true" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y libasound2-dev:arm64 libssl-dev:arm64 gcc-aarch64-linux-gnu pkg-config
            echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y libasound2-dev pkg-config libssl-dev
          fi
      - name: build release
        run: cargo build --release --target ${{ matrix.target }} -p auris
      - name: package
        shell: bash
        run: |
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z a ${{ matrix.asset }} target/${{ matrix.target }}/release/auris.exe
          else
            tar -czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release auris
          fi
      - name: checksum
        shell: bash
        # Nom de fichier unique par target : sinon le merge-multiple du job
        # release écraserait tous les checksums.txt dans un seul fichier.
        run: sha256sum ${{ matrix.asset }} > "checksums-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: checksums-${{ matrix.target }}.txt

  deb:
    name: Package .deb (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auris-${{ matrix.target }}.tar.gz
          path: pkg
      - name: construit le .deb
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          root="build-deb-$V"
          rm -rf "$root"
          mkdir -p "$root/DEBIAN" "$root/usr/local/bin" "$root/etc/systemd/system" "$root/var/lib/auris"
          tar -xzf pkg/*.tar.gz -C "$root/usr/local/bin"
          chmod 755 "$root/usr/local/bin/auris"
          cat > "$root/DEBIAN/control" <<EOF
          Package: auris
          Version: ${V}-1
          Section: sound
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: mjcc30 <mjcc30@users.noreply.github.com>
          Depends: libasound2, ffmpeg
          Homepage: https://auris.audio
          Description: Auris — lecteur audiophile style Volumio
           Binaire unique Rust : bibliothèque musicale, lecture gapless/DoP,
           radios internet, multiroom, plugins communautaires. Interface web
           embarquée sur http://<hote>:3000/.
          EOF
          cat > "$root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if ! id auris >/dev/null 2>&1; then
            useradd --system --home /var/lib/auris --shell /usr/sbin/nologin auris
          fi
          chown -R auris:auris /var/lib/auris
          if [ ! -f /var/lib/auris/config.toml ]; then
            cat > /var/lib/auris/config.toml <<'CFG'
          host = "0.0.0.0"
          port = 3000
          volume = 80
          auto_update = true
          repo_owner = "mjcc30"
          repo_name = "auris"

          [[sources]]
          id = "nas"
          name = "NAS"
          enabled = true
          kind = "local"
          path = "/mnt/nas/musique"
          CFG
            chown auris:auris /var/lib/auris/config.toml
            chmod 640 /var/lib/auris/config.toml
          fi
          systemctl daemon-reload || true
          systemctl enable auris.service || true
          systemctl restart auris.service || true
          echo "Auris installé — interface web: http://$(hostname -I | awk '{print $1}'):3000/"
          EOF
          chmod 755 "$root/DEBIAN/postinst"
          cat > "$root/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = "purge" ]; then
            systemctl stop auris.service || true
            systemctl disable auris.service || true
            userdel auris || true
            rm -rf /var/lib/auris
          fi
          systemctl daemon-reload || true
          EOF
          chmod 755 "$root/DEBIAN/postrm"
          cat > "$root/etc/systemd/system/auris.service" <<'EOF'
          [Unit]
          Description=Auris — lecteur audiophile (style Volumio)
          Documentation=https://auris.audio
          After=network-online.target sound.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=auris
          Group=auris
          ExecStart=/usr/local/bin/auris serve --data-dir /var/lib/auris
          Restart=on-failure
          RestartSec=5
          AmbientCapabilities=CAP_SYS_NICE
          Nice=-10

          [Install]
          WantedBy=multi-user.target
          EOF
          out="auris_${V}-1_${{ matrix.arch }}.deb"
          dpkg-deb --root-owner-group --build "$root" "$out"
          sha256sum "$out" >> "$out.sha256"
          echo "built $out"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: |
            auris_*.deb
            auris_*.deb.sha256

  rpm:
    name: Package .rpm (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auris-${{ matrix.target }}.tar.gz
          path: pkg
      - name: construit le .rpm
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          sudo apt-get update
          sudo apt-get install -y rpm
          top="$HOME/rpmbuild"
          mkdir -p "$top"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp pkg/*.tar.gz "$top/SOURCES/auris-$V.tar.gz"
          cp packaging/rpm/auris.service "$top/SOURCES/"
          python3 packaging/rpm/update-spec.py "$VERSION"
          cp packaging/rpm/auris.spec "$top/SPECS/"
          rpmbuild -bb --define "_topdir $top" "$top/SPECS/auris.spec"
          out="$top/RPMS/${{ matrix.arch }}/auris-$V-1.${{ matrix.arch }}.rpm"
          cp "$out" .
          sha256sum "$(basename "$out")" > "$(basename "$out").sha256"
          echo "built $(basename "$out")"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: |
            auris_*.rpm
            auris_*.rpm.sha256

  installer-win:
    name: Installeur Windows (.exe, Inno Setup)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auris-x86_64-pc-windows-msvc.zip
          path: pkg
      - name: extrait le binaire
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app | Out-Null
          Expand-Archive pkg/*.zip -DestinationPath app -Force
          Get-ChildItem app/auris.exe
      - name: installe Inno Setup
        run: choco install innosetup --version=6.3.3 -y
      - name: compile l'installeur
        env:
          VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          python3 packaging/windows/update-iss.py "$env:VERSION"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q /DAppDir="$PWD\app" packaging\windows\auris.iss
          Get-Item auris-setup-x64.exe
          sha256sum auris-setup-x64.exe > checksums-installer-win.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: auris-setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-installer-win
          path: checksums-installer-win.txt

  flatpak:
    name: Bundle Flatpak (x86_64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: installe flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: runtimes Freedesktop
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: construit le bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 packaging/flatpak/update-flatpak.py "$VERSION"
          cd packaging/flatpak
          flatpak-builder --force-clean --disable-rofiles-fuse --repo="$PWD/repo" build audio.auris.Auris.yml
          flatpak build-bundle repo "$PWD/auris.flatpak" audio.auris.Auris
          cd - >/dev/null
          sha256sum packaging/flatpak/auris.flatpak > auris.flatpak.sha256
          mv packaging/flatpak/auris.flatpak .
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-x64
          path: |
            auris.flatpak
            auris.flatpak.sha256

  release:
    name: Publie la release GitHub
    needs: [build, deb, rpm, installer-win, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: auris-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rpm-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-win
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: flatpak-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: checksums
          pattern: checksums-*
          merge-multiple: true
      - name: concat checksums
        run: cat checksums/* > artifacts/checksums.txt
      # Signature GPG des paquets (.deb/.rpm) quand la clé est fournie via
      # les secrets du dépôt (GPG_PRIVATE_KEY + GPG_PASSPHRASE). Sans secret,
      # les paquets sont publiés non signés.
      - name: signe les paquets (si clé GPG disponible)
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in artifacts/*.deb artifacts/*.rpm; do
            [ -f "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$f"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
